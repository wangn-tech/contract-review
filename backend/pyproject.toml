[project]
name = "contract-review-backend"
version = "0.1.0"
description = "AI contract review agent system for university procurement (FastAPI + LangGraph + Hybrid RAG)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42.0",
    "redis>=5.0",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "qdrant-client>=1.9",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "langfuse>=2.55",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rank-bm25>=0.2",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
eval = [
    "ragas>=0.1.14",
    "datasets>=2.19",
]
bench = [
    "locust>=2.28",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# B008: FastAPI 标准写法（Depends 在参数默认值），统一忽略
ignore = ["E501", "B008"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "python-docx>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
