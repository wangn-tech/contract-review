[project]
name = "contract-review-backend"
version = "0.1.0"
description = "AI contract review agent system for university procurement (FastAPI + LangGraph + Hybrid RAG)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy>=2.0.54",
    "pymysql>=1.1",
    "cryptography>=44.0",
    "redis>=8.1",
    "PyJWT>=2.10",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "sse-starlette>=2.3",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "qdrant-client>=1.19",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "python-docx>=1.2",
    "langfuse>=2.55",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rank-bm25>=0.2",
    "jieba>=0.42",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2",
    "datasets>=2.19",
]
bench = [
    "locust>=2.46",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# B008: FastAPI 标准写法（Depends 在参数默认值），统一忽略
ignore = ["E501", "B008"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "python-docx>=1.2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
