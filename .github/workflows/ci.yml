name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run ruff check app/ tests/ scripts/

  test:
    name: Backend Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/ -q
        env:
          DATABASE_URL: sqlite://
          JWT_SECRET_KEY: ci-secret-0123456789abcdef
          UPLOAD_DIR: /tmp/cr-uploads
          OSS_BUCKET_DIR: /tmp/cr-parsed

  frontend-build:
    name: Frontend Build (Vue3+TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker-build:
    name: Docker Images Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t contract-review-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t contract-review-frontend:ci ./frontend

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy hook (customize for your server)
        run: |
          echo "::notice::Deploy step is a placeholder. Connect SSH/webhook or registry push here."
